name: CodeQL (advisory)
on:
    pull_request:
    push:
        branches: [main]
    schedule:
        - cron: "0 13 * * 6"

jobs:
    analyze:
        runs-on: ubuntu-latest
        continue-on-error: true # <- do not block PRs
        permissions:
            security-events: write
            contents: read
        steps:
            - uses: actions/checkout@v4
            - uses: github/codeql-action/init@v3
              with:
                  languages: csharp
                  build-mode: none
            - uses: github/codeql-action/analyze@v3
