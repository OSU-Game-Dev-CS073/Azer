name: Unity CI (Tests & Build)

on:
    pull_request:
    push:
        branches: [main]

jobs:
    tests:
        name: EditMode Tests
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - name: Get Unity version
              id: unity
              run: |
                  ver=$(grep -m1 'm_EditorVersion:' ProjectSettings/ProjectVersion.txt | awk '{print $2}')
                  echo "version=$ver" >> $GITHUB_OUTPUT

            - name: Run EditMode tests
              uses: game-ci/unity-test-runner@v4
              with:
                  unityVersion: ${{ steps.unity.outputs.version }}
                  testMode: EditMode
                  customParameters: -projectPath .
              # If your tests require a license, add UNITY_LICENSE repo secret and uncomment:
              # env:
              #   UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

            - name: Upload Test Results
              if: always()
              uses: actions/upload-artifact@v4
              with:
                  name: editmode-test-results
                  path: artifacts

    build-windows:
        name: Build Windows (x86_64)
        runs-on: ubuntu-latest
        needs: tests
        steps:
            - uses: actions/checkout@v4

            - name: Get Unity version
              id: unity
              run: |
                  ver=$(grep -m1 'm_EditorVersion:' ProjectSettings/ProjectVersion.txt | awk '{print $2}')
                  echo "version=$ver" >> $GITHUB_OUTPUT

            - name: Build Player
              uses: game-ci/unity-builder@v4
              with:
                  unityVersion: ${{ steps.unity.outputs.version }}
                  targetPlatform: StandaloneWindows64
                  buildName: AzerBuild
                  projectPath: .
              env:
                  # Required for building. Add Settings → Secrets → Actions → UNITY_LICENSE
                  UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}

            - name: Upload Build
              if: ${{ success() }}
              uses: actions/upload-artifact@v4
              with:
                  name: AzerBuild-Win64
                  path: build
